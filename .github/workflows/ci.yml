name: CI & Quality Audit

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate Code Quality & Syntax
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run PowerShell Tests
        shell: pwsh
        run: |
          ./scripts/test.ps1

      - name: Verify Prohibited Strings
        shell: pwsh
        run: |
          $prohibited = @('massgrave.dev', 'activated.win', 'massgravel', 'Sonbokli', 'ohookdata', 'LibTSforge')
          $codeFiles = Get-ChildItem -Path ./src -Recurse -Filter *.ps1
          $violations = @()
          foreach ($file in $codeFiles) {
              $content = Get-Content -LiteralPath $file.FullName -Raw
              foreach ($p in $prohibited) {
                  if ($content -match $p) {
                      $violations += "$($file.Name): matches prohibited pattern '$p'"
                  }
              }
          }
          if ($violations.Count -gt 0) {
              Write-Error "Security/Cleanliness violations detected:`n$($violations -join "`n")"
              exit 1
          }
          Write-Host "Code Cleanliness Check: 100% Passed" -ForegroundColor Green

  release:
    name: Package Release Assets
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Package Release ZIP
        run: |
          mkdir -p dist
          zip -r dist/marjuk-windows-toolkit-${{ github.ref_name }}.zip LICENSE NOTICE.md README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md config src docs
          cd dist
          sha256sum marjuk-windows-toolkit-${{ github.ref_name }}.zip > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/marjuk-windows-toolkit-${{ github.ref_name }}.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true

